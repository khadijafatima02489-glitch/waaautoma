[program:whatsapp-gateway]
directory=/app/whatsapp-gateway
command=/usr/bin/node /app/whatsapp-gateway/index.js
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/whatsapp-gateway.log
stderr_logfile=/var/log/supervisor/whatsapp-gateway.err.log
environment=NODE_ENV="production"